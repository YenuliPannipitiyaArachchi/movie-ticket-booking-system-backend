spring.application.name=movie-ticket-booking
server.port=8080

# --- MySQL (override with environment variables DB_USERNAME / DB_PASSWORD) ---
spring.datasource.url=jdbc:mysql://localhost:3306/movie_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root} 
spring.datasource.password=${DB_PASSWORD:}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (Base64 secret, at least 256 bits). Override with JWT_SECRET in production ---
app.jwt.secret=${JWT_SECRET:bW92aWUtdGlja2V0LWJvb2tpbmctand0LXNlY3JldC1rZXktaWpzZS1jbWpkLTExNC0xMTUtY291cnNld29yaw==}
app.jwt.expiration-ms=86400000

# --- CORS (React dev server) ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- Insert demo admin/customer/movies/theatres/shows on first start ---
app.seed=true

logging.level.com.ijse.moviebooking=INFO
logging.level.org.springframework.security=WARN
